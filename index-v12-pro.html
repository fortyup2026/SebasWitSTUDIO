ion:absolute;left:50%;bottom:-19px;transform:translateX(-50%);font-size:8px;font-weight:800;background:rgba(5,13,25,.82);padding:2px 5px;border-radius:999px;border:1px solid rgba(255,255,255,.09);white-space:nowrap}.npc.off{opacity:.52}.activity-strip{display:flex;gap:7px;overflow:auto;padding:10px}.activity-pill{min-width:max-content;border:1px solid var(--line);background:rgba(255,255,255,.025);border-radius:999px;padding:7px 9px;font-size:10px}.activity-pill b{margin-right:5px}.activity-pill .st{color:var(--muted)}

const HOT=[{key:'direction',label:'Dirección',x:15,y:3,w:30,h:18},{key:'coordination',label:'Coordinación',x:47,y:3,w:28,h:18},{key:'youtube',label:'YouTube',x:11,y:22,w:17,h:21},{key:'tiktokMain',label:'TikTok SebasWit',x:28,y:22,w:14,h:21},{key:'tiktokDual',label:'TikTok DUAL',x:42,y:22,w:15,h:21},{key:'instagram',label:'Instagram',x:57,y:22,w:12,h:21},{key:'spotify',label:'Spotify',x:69,y:22,w:12,h:21},{key:'meeting',label:'Sala de reuniones',x:10,y:44,w:23,h:22},{key:'strategy',label:'Estrategia',x:37,y:44,w:19,h:22},{key:'publishing',label:'Publishing / Editorial',x:56,y:44,w:19,h:22},{key:'lunch',label:'Comedor',x:80,y:27,w:15,h:40},{key:'restroom',label:'Baño',x:83,y:5,w:12,h:20}];
let data=clone(FALLBACK),states={},insights=[],timer=null;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)], clone=o=>JSON.parse(JSON.stringify(o));
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmt(v){return Number(v||0).toLocaleString('es-AR')}
function nowAR(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date()).reduce((o,p)=>(o[p.type]=p.value,o),{});return{date:`${p.year}-${p.month}-${p.day}`,weekday:p.weekday,h:+p.hour,m:+p.minute,mins:+p.hour*60+(+p.minute)}}
function inR(m,a,b){return m>=a&&m<b} function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h}
function storageGet(k){try{return localStorage.getItem(k)}catch{return null}} function storageSet(k,v){try{localStorage.setItem(k,v)}catch{}}
function meeting(id,m,n){const rot=['chevy','nora','luca','iris','echo','luz'][hash(n.date)%6],list=[{a:630,b:675,ids:['chevy','vera','atlas'],task:'Revisión YouTube'},{a:690,b:735,ids:['nora','luca','iris','atlas'],task:'Revisión redes'},{a:930,b:990,ids:['facu','atlas',rot],task:'Estrategia'},{a:1050,b:1085,ids:['sebas','facu'],task:'Resumen Dirección'},{a:1095,b:1125,ids:['facu','atlas','luz'],task:'Plan editorial'}];for(const mt of list){if(inR(m,mt.a,mt.b)&&mt.ids.includes(id)){const i=mt.ids.indexOf(id);return{status:'meeting',anchor:['meeting1','meeting2','meeting3','meeting4'][i]||'meeting1',task:mt.task}}return null}
function lunch(id,m){const s={chevy:[735,780,'lunch1'],iris:[735,780,'lunch2'],echo:[735,780,'lunch3'],luz:[735,780,'lunch4'],vera:[780,825,'lunch1'],nora:[780,825,'lunch2'],luca:[780,825,'lunch3'],atlas:[780,825,'lunch4'],facu:[825,855,'lunch2'],sebas:[855,885,'lunch1']}[id];return s&&inR(m,s[0],s[1])?{status:'lunch',anchor:s[2],task:'Almorzando'}:null}
function breakState(id,m,n){if(id==='sebas'||id==='facu')return null;const seed=hash(id+n.date),b1=585+(seed%110),b2=900+((seed>>3)%140);return(inR(m,b1,b1+7)||inR(m,b2,b2+7))?{status:'break',anchor:'restroom',task:'Pausa breve'}:null}

function state(id,n){const weekend=n.weekday==='Sat'||n.weekday==='Sun',open=weekend?600:540,close=weekend?1290:1320;if(!inR(n.mins,open,close))return{status:'off',anchor:AGENTS[id].home,task:'Fuera de horario'};return meeting(id,n.mins,n)||lunch(id,n.mins)||breakState(id,n.mins,n)||{status:'working',anchor:AGENTS[id].home,task:task(id)}}
function sl(s){return({working:'Trabajando',meeting:'Reunión',lunch:'Almuerzo',break:'Pausa',off:'Fuera de horario'})[s]||s}

function buildNotes(){const d=nowAR().date;insights.filter(x=>x.priority>=2).slice(0,5).forEach(x=>addNote({id:`${d}-${x.key}-${hash(x.action)}`,sector:x.key,title:'Informe para Facu',message:x.action,priority:x.priority}));addNote({id:`${d}-books-aethrion`,sector:'books',title:'Editorial activa',message:'AETHRION figura como publicado en Google Play Libros y queda listo para acciones de promoción.',priority:1})}
function metricPairs(k){const m=data.sectors[k]?.metrics||{},d={youtube:[['Suscriptores',m.subscribers],['Vistas canal',m.totalViews],['Vistas recientes',m.periodViews],['Top video',m.topVideo]],tiktokMain:[['Seguidores',m.followers],['Likes',m.totalLikes],['Videos',m.videos],['Vistas recientes',m.periodViews]],tiktokDual:[['Seguidores',m.followers],['Likes',m.totalLikes],['Videos',m.videos],['Vistas recientes',m.periodViews]],instagram:[['Cuenta',m.account],['Seguidores',m.followers],['Posts',m.mediaCount],['Alcance',m.reach]],spotify:[['Artista',m.artist||'SebasWit'],['Estado',m.connected===true?'API conectada':'Perfil identificado'],['Seguidores',m.followers??'-'],['Lanzamientos',m.releases??'-']],strategy:[['Estado','Activo'],['Cruce','Multiplataforma'],['Agente','Atlas'],['Prioridad','Hoy']],publishing:[['Estado','Activo'],['Área','Contenido + Libros'],['Agente','Luz'],['Calendario','En revisión']]};return d[k]||[]}
function npc(id,a,s){const p=A[s.anchor]||A[a.home];return`<button class="npc ${s.status==='off'?'off':''}" data-id="${id}" style="left:${p.x}%;top:${p.y}%"><span class="npc-shadow"></span><img src="${a.sprite}" alt="${a.name}" onerror="this.style.opacity='.25'"><span class="npc-name">${a.name}</span></button>`}
function renderCards(){const ks=['youtube','tiktokMain','tiktokDual','instagram','spotify','strategy','publishing'];let html=ks.map(k=>{const s=data.sectors[k],i=insights.find(x=>x.key===k)||analyze(k);return`<article class="sector-card"><div class="sector-head"><div><h3>${esc(s.title)}</h3><p>${esc(s.agent)}</p></div><span class="badge">${data.source==='live'?'en vivo':'modo seguro'}</span></div><div class="metrics">${metricPairs(k).map(([l,v])=>`<div class="metric"><span>${esc(l)}</span><strong>${typeof v==='number'?fmt(v):esc(v)}</strong></div>`).join('')}</div><span class="priority ${i.priority>=3?'high':i.priority===2?'medium':'low'}">Prioridad ${i.priority>=3?'alta':i.priority===2?'media':'baja'}</span><div class="actions"><button class="btn primary" data-sector="${k}">Ver informe</button>${k==='spotify'?`<a class="btn" href="${SPOTIFY_URL}" target="_blank" rel="noopener">Abrir Spotify</a>`:''}</div></article>`}).join('');
html+=`<article class="sector-card books-card"><div class="sector-head"><div><h3>Editorial / Libros</h3><p>Luz + Atlas · catálogo y promoción</p></div><span class="badge">Google Play Libros</span></div><div class="book-row"><div class="book-cover">AETHRION</div><div class="book-copy"><h4>AETHRION</h4><p>Estado: <b>Publicado</b><br>Plataforma: Google Play Libros<br>La editorial puede generar tareas de promoción, reels, fragmentos y calendario.</p><div class="actions"><a class="btn primary" href="${BOOK_URL}" target="_blank" rel="noopener">Ver en Google Play Libros</a><button class="btn" id="bookReport">Informe editorial</button></div></div></div></article>`;return html}
function render(){const n=nowAR();states=Object.fromEntries(Object.keys(AGENTS).map(id=>[id,state(id,n)]));const count={working:0,meeting:0,lunch:0,break:0};Object.values(states).forEach(s=>{if(count[s.status]!=null)count[s.status]++});const ns=notes(),unread=ns.filter(x=>!x.read).length;$('#app').innerHTML=`<div class="shell"><header class="topbar"><div class="brand"><div class="brandmark">SW</div><div><h1>SebasWeb Studios</h1><p>V12 Pro · Música · Redes · DUAL · Editorial</p></div></div><div class="top-actions"><div class="chip hide-sm"><small>${n.date}</small><b>${String(n.h).padStart(2,'0')}:${String(n.m).padStart(2,'0')}</b></div><div class="chip hide-sm"><small>Datos</small><b>${data.source==='live'?'EN VIVO':'SEGURO'}</b></div><button class="icon-btn" id="refresh">↻ Actualizar</button><button class="icon-btn bell" id="bell">🔔 Facu${unread?`<span class="bell-count">${unread}</span>`:''}</button></div></header>
<section class="hero"><div class="hero-card"><span class="eyebrow">Centro de operaciones creativo</span><h2>Tu empresa virtual, ahora con ala editorial.</h2><p>Redes, música, DUAL/Nexus y libros en un mismo sistema. Cada sector analiza, Atlas cruza señales, Luz convierte decisiones en calendario y Facu te entrega lo importante.</p></div><div class="hero-side"><div class="mini-kpi"><span>Áreas</span><strong>8</strong></div><div class="mini-kpi"><span>NPCs</span><strong>10</strong></div><div class="mini-kpi"><span>Libros</span><strong>1+</strong></div><div class="mini-kpi"><span>Flujo</span><strong>Activo</strong></div></div></section>
<section class="summary"><div class="summary-card"><small>Trabajando</small><strong>${count.working}</strong><p>en sus puestos</p></div><div class="summary-card"><small>En reunión</small><strong>${count.meeting}</strong><p>análisis conjunto</p></div><div class="summary-card"><small>Almuerzo</small><strong>${count.lunch}</strong><p>turnos escalonados</p></div><div class="summary-card"><small>Prioridades</small><strong>${insights.filter(x=>x.priority>=3).length}</strong><p>detectadas</p></div><div class="summary-card"><small>Avisos nuevos</small><strong>${unread}</strong><p>centralizados por Facu</p></div></section>
<div class="section-head"><div><h2>La empresa ahora</h2><p>Los personajes quedan integrados al piso y cambian de sala según horario, reunión o almuerzo.</p></div><div class="legend"><span><i class="dot" style="background:var(--green)"></i>Trabajando</span><span><i class="dot" style="background:var(--violet)"></i>Reunión</span><span><i class="dot" style="background:var(--amber)"></i>Almuerzo</span></div></div>
<section class="map-card"><div class="map-frame"><img class="map-bg" src="/studio-map.png" alt="SebasWeb Studios"><div class="map-tint"></div>${HOT.map(r=>`<button class="hotspot" data-room="${r.key}" style="left:${r.x}%;top:${r.y}%;width:${r.w}%;height:${r.h}%"><span>${r.label}</span></button>`).join('')}${Object.entries(AGENTS).map(([id,a])=>npc(id,a,states[id])).join('')}</div><div class="activity-strip">${Object.entries(AGENTS).map(([id,a])=>`<div class="activity-pill"><b>${a.name}</b><span class="st">${sl(states[id].status)} · ${esc(states[id].task)}</span></div>`).join('')}</div></section>
<div class="section-head"><div><h2>Informes por sector</h2><p>La V12 suma Editorial / Libros sin mezclarlo con música ni DUAL.</p></div></div><section class="sector-grid">${renderCards()}</section></div><div id="overlayRoot"></div>`;
$('#refresh').onclick=()=>load(true);$('#bell').onclick=openFacu;$$('.npc').forEach(b=>b.onclick=()=>openAgent(b.dataset.id));$$('[data-sector]').forEach(b=>b.onclick=()=>openSector(b.dataset.sector));$$('.hotspot').forEach(b=>b.onclick=()=>openRoom(b.dataset.room));if($('#bookReport'))$('#bookReport').onclick=openBooks}
function open(html){$('#overlayRoot').innerHTML=`<div class="overlay" id="overlay"><aside class="drawer">${html}</aside></div>`;$('#close').onclick=()=>$('#overlayRoot').innerHTML='';$('#overlay').onclick=e=>{if(e.target.id==='overlay')$('#overlayRoot').innerHTML=''}}
function openSector(k){const s=data.sectors[k],i=insights.find(x=>x.key===k)||analyze(k);open(`<div class="drawer-top"><div><h2>${esc(s.title)}</h2><p class="subtitle">Informe de ${esc(s.agent)}</p></div><button id="close" class="close">×</button></div><div class="metrics">${metricPairs(k).map(([l,v])=>`<div class="metric"><span>${esc(l)}</span><strong>${typeof v==='number'?fmt(v):esc(v)}</strong></div>`).join('')}</div><div class="block"><h4>Lectura</h4><p>${esc(i.finding)}</p></div><div class="block"><h4>Acción sugerida</h4><p>${esc(i.action)}</p></div>${k==='spotify'?`<a class="btn primary" href="${SPOTIFY_URL}" target="_blank">Abrir SebasWit en Spotify</a>`:''}`)}
function openAgent(id){const a=AGENTS[id],s=states[id];open(`<div class="drawer-top"><div><h2>${a.name}</h2><p class="subtitle">${a.role}</p></div><button id="close" class="close">×</button></div><div class="block"><h4>${sl(s.status)}</h4><p>${esc(s.task)}</p></div><div class="block"><h4>Rol dentro de SebasWeb Studios</h4><p>${id==='facu'?'Centraliza informes y notificaciones para Dirección.':id==='sebas'?'Recibe el resumen ejecutivo y toma decisiones finales.':id==='atlas'?'Cruza señales entre plataformas y proyectos.':id==='luz'?'Organiza publicaciones, calendario y el área Editorial / Libros.':'Trabaja sobre las métricas y necesidades de su sector.'}</p></div>`)}
function openBooks(){open(`<div class="drawer-top"><div><h2>Editorial / Libros</h2><p class="subtitle">Luz + Atlas</p></div><button id="close" class="close">×</button></div><div class="block"><h4>AETHRION</h4><p><b>Estado:</b> Publicado<br><b>Plataforma:</b> Google Play Libros</p></div><div class="block"><h4>Qué puede hacer el sector</h4><p>Planificar reels, fragmentos, videos de personajes, trailers, cruces con el universo AETHRION y calendario de promoción.</p></div><a class="btn primary" href="${BOOK_URL}" target="_blank" rel="noopener">Ver libro en Google Play</a>`)}
function openFacu(){const list=notes().map(n=>({...n,read:true}));storageSet('sw_v12_notes',JSON.stringify(list));const top=insights.filter(x=>x.priority>=2).slice(0,3);open(`<div class="drawer-top"><div><h2>Centro Facu</h2><p class="subtitle">Coordinación y resumen ejecutivo</p></div><button id="close" class="close">×</button></div><div class="block"><h4>Qué priorizaría hoy</h4><p>${esc(top.map((x,i)=>`${i+1}. ${x.action}`).join(' ')||'No hay alertas importantes.')}</p></div><div class="block"><h4>Notificaciones</h4>${list.slice(0,12).map(n=>`<div class="note"><small>${esc(n.sector)} · ${new Date(n.date).toLocaleString('es-AR')}</small><b>${esc(n.title)}</b><p>${esc(n.message)}</p></div>`).join('')}</div><div class="block"><h4>Consultar a Facu</h4><div class="question"><input id="q" placeholder="¿Qué priorizamos hoy?"><button class="btn primary" id="ask">Preguntar</button></div><div id="ans"></div></div>`);$('#ask').onclick=()=>{const q=($('#q').value||'').toLowerCase();let a=top.map((x,i)=>`${i+1}. ${x.action}`).join(' ');if(q.includes('libro')||q.includes('aethrion'))a='Editorial recomienda una pieza de promoción de AETHRION y un calendario separado del contenido musical.';else if(q.includes('spotify'))a=analyze('spotify').action;else if(q.includes('youtube'))a=analyze('youtube').action;else if(q.includes('dual'))a=analyze('tiktokDual').action;$('#ans').innerHTML=`<div class="answer">${esc(a)}</div>`}}
function openRoom(r){const map={youtube:'youtube',tiktokMain:'tiktokMain',tiktokDual:'tiktokDual',instagram:'instagram',spotify:'spotify',strategy:'strategy',publishing:'publishing'};if(map[r])return openSector(map[r]);if(r==='direction')return openAgent('sebas');if(r==='coordination')return openAgent('facu');const names={meeting:'Sala de reuniones',lunch:'Comedor',restroom:'Baño'};open(`<div class="drawer-top"><div><h2>${names[r]}</h2><p class="subtitle">Área común</p></div><button id="close" class="close">×</button></div><div class="block"><p>${r==='meeting'?'Los agentes aparecen aquí durante reuniones programadas y luego regresan a su puesto.':r==='lunch'?'Los almuerzos están escalonados para que la empresa siga operativa.':'Las pausas son breves y distribuidas durante la jornada.'}</p></div>`)}
async function load(showToast=false){let controller=new AbortController(),to=setTimeout(()=>controller.abort(),6000);try{const r=await fetch('/api/studio?t='+Date.now(),{cache:'no-store',signal:controller.signal});if(r.ok){const incoming=await r.json();if(incoming&&incoming.sectors)data={...incoming,sectors:{...FALLBACK.sectors,...incoming.sectors}}}}catch(e){console.warn('Modo seguro',e);data=clone(FALLBACK)}finally{clearTimeout(to)}insights=makeInsights();buildNotes();render();if(showToast){const t=document.createElement('div');t.className='toast';t.textContent='Datos actualizados';document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}}
function tick(){const n=nowAR(),next=Object.fromEntries(Object.keys(AGENTS).map(id=>[id,state(id,n)]));if(Object.keys(next).some(id=>!states[id]||states[id].anchor!==next[id].anchor||states[id].status!==next[id].status)){states=next;render()}}
function boot(){insights=makeInsights();buildNotes();render();load(false);timer=setInterval(tick,60000);setInterval(()=>load(false),300000)}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
})();
</script>
</body>
</html>
